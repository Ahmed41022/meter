name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Both, because the suite has twice now been green on one and red on the
    # other: once on a timezone the runner did not share, once on a file path
    # built the way only Windows accepts. Neither showed up until it ran
    # somewhere else.
    strategy:
      # Never cancel the other one. Knowing a failure is on both platforms, or
      # on only one, is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Integration tests run against dist/, so it has to exist first.
      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run coverage

      # One copy is enough, and two would collide on the artifact name.
      - name: Upload the built app
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: meter-html
          path: dist/meter.html
          if-no-files-found: error
