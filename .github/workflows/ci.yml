name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Integration tests run against dist/, so it has to exist first.
      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run coverage

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: meter-html
          path: dist/meter.html
          if-no-files-found: error
